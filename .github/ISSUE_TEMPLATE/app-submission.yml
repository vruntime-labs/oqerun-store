name: Oqerun Store App Submission
description: Submit an open-source application for Oqerun Store review.
title: "Store App Submission: "
labels:
  - store:submitted
body:
  - type: markdown
    attributes:
      value: |
        <!-- oqerun-store-submission -->

        Thanks for submitting an application to Oqerun Store.

        **Process:** submission → automated validation → maintainer review → approval → catalog generation → Store build → publication.

  - type: input
    id: repository
    attributes:
      label: GitHub Repository URL
      description: Public GitHub repository URL. The repository must be accessible without authentication.
      placeholder: https://github.com/owner/repository
    validations:
      required: true

  - type: input
    id: live-app
    attributes:
      label: Live App URL
      description: HTTPS URL where the app can be opened. Required for Web App and PWA submissions.
      placeholder: https://example.github.io/app/

  - type: input
    id: app-name
    attributes:
      label: App Name
      description: The public name users should see in Oqerun Store.
      placeholder: Example App
    validations:
      required: true

  - type: input
    id: publisher
    attributes:
      label: Publisher / Developer Name
      description: Individual, organization, or project name responsible for the app.
      placeholder: Example Developer
    validations:
      required: true

  - type: input
    id: contact
    attributes:
      label: Contact GitHub Username or Email
      description: Optional contact for listing corrections, takedown requests, or compatibility questions.
      placeholder: @username or email@example.com

  - type: dropdown
    id: category
    attributes:
      label: App Category
      options:
        - Productivity
        - Development
        - Education
        - Graphics
        - Media
        - Utilities
        - Games
        - Internet
        - System
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: App Description
      description: Describe what the application does and what users can use it for.
      placeholder: A clear description of the application's purpose and main features.
    validations:
      required: true

  - type: input
    id: license
    attributes:
      label: License
      description: License declared by the repository, preferably an SPDX identifier such as MIT, Apache-2.0, GPL-3.0, or MPL-2.0.
      placeholder: MIT
    validations:
      required: true

  - type: dropdown
    id: application-type
    attributes:
      label: Application Type
      options:
        - .oqpkg (Oqerun Native)
        - PWA
        - Web App
        - WebAssembly
        - Other
    validations:
      required: true

  - type: checkboxes
    id: authorization
    attributes:
      label: Authorization
      description: You must control the project or be authorized to submit it.
      options:
        - label: I confirm I control or am authorized to submit this project and its repository is publicly available under a license permitting the requested Oqerun Store listing.
          required: true

  - type: markdown
    attributes:
      value: |
        ### What happens next?

        Oqerun Store validates the repository, checks the declared license and application type against repository metadata, rejects duplicate catalog IDs, generates the catalog entry, updates third-party notices for community apps, builds the Store, and only then marks the submission as published.

        Approval is performed by an authorized Oqerun Store maintainer. Publication does not transfer ownership of a community application to VRuntime Labs.
