name: Oqerun Store App Submission
description: Submit an open-source application for Oqerun Store review.
title: "Store App Submission: "
labels:
  - store-submission
body:
  - type: markdown
    attributes:
      value: |
        Thanks for submitting an application to Oqerun Store.
  - type: input
    id: repository
    attributes:
      label: GitHub repository
      description: Public GitHub repository URL.
      placeholder: https://github.com/owner/repository
    validations:
      required: true
  - type: input
    id: live-app
    attributes:
      label: Live app URL
      description: HTTPS URL where the web or PWA application can be opened, if available.
      placeholder: https://example.github.io/app/
  - type: textarea
    id: scan
    attributes:
      label: Automated scan
      description: Paste the report generated by Oqerun Store.
    validations:
      required: true
  - type: textarea
    id: publisher
    attributes:
      label: Publisher information
      description: Publisher name, contact or GitHub username, app name, category and preferred Store listing details.
    validations:
      required: true
